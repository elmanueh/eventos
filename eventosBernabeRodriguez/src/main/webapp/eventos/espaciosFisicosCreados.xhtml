<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Mis Espacios Fisicos</title>
</h:head>
<h:body>
	<div class="card">
		<f:metadata>
			<f:viewParam name="nombre" value="#{misEspaciosFisicosWeb.propietario}" />
			<f:viewAction action="#{misEspaciosFisicosWeb.load()}" />
		</f:metadata>
		<h:form id="form">
			<p:growl id="messages" showDetail="true" />

			<p:dataTable id="tablaEspaciosFisicos" var="espacioFisicoDTO"
				value="#{misEspaciosFisicosWeb.espaciosFisicos}"
				rowKey="#{espacioFisicoDTO.id}"
				selection="#{misEspaciosFisicosWeb.espacioSeleccionado}"
				selectionMode="single">


				<p:column headerText="Nombre">
					<h:outputText value="#{espacioFisicoDTO.nombre}" />
				</p:column>
				<p:column headerText="Capacidad">
					<h:outputText value="#{espacioFisicoDTO.capacidad}" />
				</p:column>
				<p:column headerText="Dirección postal">
					<h:outputText value="#{espacioFisicoDTO.direccion}" />
				</p:column>
				<p:column headerText="Estado">
					<h:outputText value="#{espacioFisicoDTO.estado}" />
				</p:column>
				<p:column>
					<p:commandButton icon="pi pi-pencil"
						styleClass="ui-button-secondary" process="@this @parent"
						oncomplete="PF('cambiarEstadoDialog').show()">
						<f:setPropertyActionListener value="#{espacioFisicoDTO}"
							target="#{misEspaciosFisicosWeb.espacioSeleccionado}" />
					</p:commandButton>
				</p:column>
			</p:dataTable>

			<p:confirmDialog widgetVar="cambiarEstadoDialog" showEffect="fade"
				width="330" message="¿Deseas cambiar el estado?"
				header="Confirmar cambio" severity="warn">
				<p:commandButton value="Yes" icon="pi pi-check"
					actionListener="#{misEspaciosFisicosWeb.cambiarEstado()}"
					update="tablaEspaciosFisicos" process="@form"
					oncomplete="PF('cambiarEstadoDialog').hide()" />
				<p:commandButton value="No" type="button"
					styleClass="ui-button-danger" icon="pi pi-times"
					onclick="PF('cambiarEstadoDialog').hide()" />
			</p:confirmDialog>
		</h:form>
	</div>
</h:body>
</html>
