<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<ui:define name="title">
        #{text.misEspacios}
    </ui:define>

	<ui:define name="content">
		<div>
			<f:metadata>
				<f:viewParam name="nombre"
					value="#{misEspaciosFisicosWeb.propietario}" />
				<f:viewAction action="#{misEspaciosFisicosWeb.load()}" />
			</f:metadata>

			<h:form id="form">
				<p:growl id="messages" showDetail="true" />

				<p:dataTable id="tablaEspaciosFisicos" var="espacioFisicoDTO"
					value="#{misEspaciosFisicosWeb.espaciosFisicos}" emptyMessage="#{text.noEncontrados}">
					
					<p:column headerText="#{text.nombre}">
						<h:outputText value="#{espacioFisicoDTO.nombre}" />
					</p:column>
					<p:column headerText="#{text.capacidad}">
						<h:outputText value="#{espacioFisicoDTO.capacidad}" />
					</p:column>
					<p:column headerText="#{text.direccion}">
						<h:outputText value="#{espacioFisicoDTO.direccion}" />
					</p:column>
					<p:column headerText="#{text.estado}">
						<h:outputText value="#{misEspaciosFisicosWeb.getEstadoTexto(espacioFisicoDTO.estado)}" />
					</p:column>
					<p:column>
						<p:commandButton icon="pi pi-pencil"
							styleClass="ui-button-success" process="@this"
							oncomplete="PF('cambiarEstadoDialog').show()">
							<f:setPropertyActionListener value="#{espacioFisicoDTO}"
								target="#{misEspaciosFisicosWeb.espacioSeleccionado}" />
						</p:commandButton>
					</p:column>
				</p:dataTable>

				<p:confirmDialog widgetVar="cambiarEstadoDialog" showEffect="fade"
					width="330" message="#{text.confirmarCambioP}"
					header="#{text.confirmarCambio}" severity="info">
					<p:commandButton value="#{text.si}" icon="pi pi-check"
						actionListener="#{misEspaciosFisicosWeb.cambiarEstado()}"
						update="tablaEspaciosFisicos messages" process="@form"
						oncomplete="PF('cambiarEstadoDialog').hide()" />
					<p:commandButton value="#{text.no}" type="button"
						styleClass="ui-button-danger" icon="pi pi-times"
						onclick="PF('cambiarEstadoDialog').hide()" />
				</p:confirmDialog>

			</h:form>
		</div>
	</ui:define>
</ui:composition>
