<!DOCTYPE html>
<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<ui:define name="title">
        #{text.altaEvento}
    </ui:define>

	<ui:define name="opciones">
		<p:button styleClass="ui-button-raised ui-button-flat" value="#{text.filtrarEspacios}"
			outcome="/eventos/espaciosFisicosFiltrados.xhtml" />
	</ui:define>

	<ui:define name="content">
		<f:metadata>
			<f:viewAction action="#{altaEventoWeb.load()}" />
		</f:metadata>

		<section class="flex justify-content-center mb-8">
			<h:form class="w-4 text-right ">
				<p:growl id="messages" showDetail="true" />
				<p:panelGrid columns="2" columnClasses="ui-grid-col-4,ui-grid-col-8"
					layout="grid" styleClass="ui-panelgrid-blank ui-fluid"
					style="border:0px none; background-color:transparent">

					<p:outputLabel for="@next" value="#{text.nombre}" />
					<p:inputText value="#{altaEventoWeb.nombre}" />

					<p:outputLabel for="@next" value="#{text.descripcion}" />
					<p:inputTextarea rows="2" value="#{altaEventoWeb.descripcion}" />

					<p:outputLabel for="@next" value="#{text.organizador}" />
					<p:inputText value="#{altaEventoWeb.organizador}" readonly="true"/>

					<p:outputLabel for="@next" value="#{text.numeroPlazas}" />
					<p:spinner value="#{altaEventoWeb.numPlazas}" min="1" converter="javax.faces.Integer" >
                        <p:ajax event="change" update="select-ef" />
                    </p:spinner>

					<p:outputLabel for="@next" value="#{text.categoria}" />
					<p:selectOneMenu id="categoria" value="#{altaEventoWeb.categoria}"
						hideNoSelectionOption="#{not empty altaEventoWeb.categoria}"
						styleClass="flex">
						<p:ajax update="@this" process="@this" />
						<f:selectItem itemLabel="#{text.seleccionarCategoria}"
							itemValue="#{null}" noSelectionOption="true" />
						<f:selectItems value="#{altaEventoWeb.categorias}"
							itemLabel="#{categoria}" itemValue="#{categoria}" />
					</p:selectOneMenu>

					<p:outputLabel for="@next" value="#{text.fechaInicio}" />
					<p:datePicker id="fechaInicio" value="#{altaEventoWeb.fechaInicio}"
						showTime="true" readonlyInput="true"
						maxdate="#{altaEventoWeb.fechaFin}" hideOnDateTimeSelect="true">
						<p:ajax event="dateSelect" update="fechaFin select-ef" />
					</p:datePicker>

					<p:outputLabel for="@next" value="#{text.fechaFin}" />
					<p:datePicker id="fechaFin" value="#{altaEventoWeb.fechaFin}"
						showTime="true" readonlyInput="true"
						mindate="#{altaEventoWeb.fechaInicio}" hideOnDateTimeSelect="true">
						<p:ajax event="dateSelect" update="fechaInicio select-ef" />
					</p:datePicker>

					<p:outputLabel for="@next" value="#{text.espacioFisico}" />
                    <p:selectOneMenu id="select-ef" value="#{altaEventoWeb.espacioFisicoID}" dynamic="true">
                        <f:selectItem itemLabel="Seleccionar..." itemValue="" />
                        <f:selectItems value="#{altaEventoWeb.espaciosFisicos}" var="item" itemLabel="#{item.nombre}" itemValue="#{item.id}" />
                    </p:selectOneMenu>
                    
                    <p:row>
						<p:column styleClass="ui-grid-col-12">
							<p:commandButton class="font-bold" value="#{text.crearEvento}"
								styleClass="ui-button-raised ui-button-secondary w-4"
								actionListener="#{altaEventoWeb.altaEvento()}" update="messages"
								process="@form" />
						</p:column>
					</p:row>
				</p:panelGrid>
			</h:form>
		</section>

	</ui:define>
</ui:composition>
