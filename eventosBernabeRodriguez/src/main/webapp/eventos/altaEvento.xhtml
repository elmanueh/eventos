<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
	<ui:define name="title">
        Alta Evento
    </ui:define>

	<ui:define name="rol">
        Organizador
    </ui:define>

	<ui:define name="opciones">
		<p:button value="Filtrar Espacios"
			outcome="/eventos/espaciosFisicosFiltrados.xhtml" />
	</ui:define>

	<ui:define name="content">
		<div style="display: flex; justify-content: center;">
			<f:metadata>
				<f:viewAction action="#{altaEventoWeb.load()}" />
			</f:metadata>
			<h:form style="width: 35%; padding: 20px;">

				<p:growl id="messages" showDetail="true" />

				<div id="main"
					style="display: flex; flex-direction: column; gap: 10px;">
					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Nombre:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:inputText value="#{altaEventoWeb.nombre}" style="flex: 1;" />
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Descripción:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:inputTextarea value="#{altaEventoWeb.descripcion}"
							style="flex: 1;" />
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Organizador:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:inputText value="#{altaEventoWeb.organizador}" style="flex: 1;" />
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Número de plazas:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:spinner value="#{altaEventoWeb.numPlazas}" min="1"
							converter="javax.faces.Integer" style="flex: 1;" />
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Categoría:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:selectOneMenu id="categoria" value="#{altaEventoWeb.categoria}"
							style="flex: 1;">
							<f:selectItem itemLabel="Seleccionar Categoría" itemValue="" />
							<f:selectItems value="#{altaEventoWeb.categorias}"
								itemLabel="#{categoria}" itemValue="#{categoria}" />
						</p:selectOneMenu>
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Fecha de inicio:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:datePicker value="#{altaEventoWeb.fechaInicio}" locale="es"
							monthNavigator="true" pattern="dd-MM-yyyy HH:mm"
							hideOnDateTimeSelect="true" showTime="true" style="flex: 1;" />
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="Fecha de fin:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:datePicker value="#{altaEventoWeb.fechaFin}" locale="es"
							monthNavigator="true" pattern="dd-MM-yyyy HH:mm"
							hideOnDateTimeSelect="true" showTime="true" style="flex: 1;" />
					</div>

					<div style="display: flex; align-items: center;">
						<p:outputLabel value="ID del espacio físico:"
							style="font-weight: bold; width: 30%; margin-right: 15px; display: flex; justify-content: end;" />
						<p:inputText value="#{altaEventoWeb.espacioFisicoID}"
							style="flex: 1;" />
					</div>
					<div style="display: flex; justify-content: center;">
						<p:commandButton value="Alta"
							actionListener="#{altaEventoWeb.altaEvento()}" update="messages"
							process="@form"
							style="font-weight: bold; height: 50px; width: 150px;
               display: flex; justify-content: center; align-items: center; text-align: center;" />
					</div>
				</div>
			</h:form>
		</div>

	</ui:define>
</ui:composition>
