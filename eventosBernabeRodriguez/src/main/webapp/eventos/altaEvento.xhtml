<!DOCTYPE html>
<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<ui:define name="title">
        Alta Evento
    </ui:define>

	<ui:define name="rol">
        Organizador
    </ui:define>

	<ui:define name="opciones">
		<p:button value="Filtrar Espacios"
			outcome="/eventos/espaciosFisicosFiltrados.xhtml" />
	</ui:define>

	<ui:define name="content">
		<f:metadata>
			<f:viewAction action="#{altaEventoWeb.load()}" />
		</f:metadata>

		<section class="flex justify-content-center">
			<h:form class="w-4 text-right ">
				<p:growl id="messages" showDetail="true" />
				<p:panelGrid columns="2" columnClasses="ui-grid-col-4,ui-grid-col-8"
					layout="grid" styleClass="ui-panelgrid-blank ui-fluid"
					style="border:0px none; background-color:transparent">

					<p:outputLabel for="@next" value="Nombre" />
					<p:inputText value="#{altaEventoWeb.nombre}" />

					<p:outputLabel for="@next" value="Descripción" />
					<p:inputTextarea rows="2" value="#{altaEventoWeb.descripcion}" />

					<p:outputLabel for="@next" value="Organizador" />
					<p:inputText value="#{altaEventoWeb.organizador}" />

					<p:outputLabel for="@next" value="Número de plazas" />
					<p:spinner value="#{altaEventoWeb.numPlazas}" min="1"
						converter="javax.faces.Integer" />

					<p:outputLabel for="@next" value="Categoría" />
					<p:selectOneMenu id="categoria" value="#{altaEventoWeb.categoria}"
						hideNoSelectionOption="#{not empty altaEventoWeb.categoria}"
						styleClass="flex">
						<p:ajax update="@this" process="@this" />
						<f:selectItem itemLabel="Seleccionar Categoría"
							itemValue="#{null}" noSelectionOption="true" />
						<f:selectItems value="#{altaEventoWeb.categorias}"
							itemLabel="#{categoria}" itemValue="#{categoria}" />
					</p:selectOneMenu>

					<p:outputLabel for="@next" value="Fecha de inicio" />
					<p:datePicker id="fechaInicio" value="#{altaEventoWeb.fechaInicio}"
						showTime="true" readonlyInput="true"
						maxdate="#{altaEventoWeb.fechaFin}">
						<p:ajax event="dateSelect" update="fechaFin" />
					</p:datePicker>

					<p:outputLabel for="@next" value="Fecha de fin" />
					<p:datePicker id="fechaFin" value="#{altaEventoWeb.fechaFin}"
						showTime="true" readonlyInput="true"
						mindate="#{altaEventoWeb.fechaInicio}">
						<p:ajax event="dateSelect" update="fechaInicio" />
					</p:datePicker>

					<p:outputLabel for="@next" value="Espacio fisico" />
					<p:inputText value="#{altaEventoWeb.espacioFisicoID}" />
					<p:row>
						<p:column styleClass="ui-grid-col-12">
							<p:commandButton class="font-bold" value="Crear Evento"
								styleClass="ui-button-raised ui-button-secondary w-4"
								actionListener="#{altaEventoWeb.altaEvento()}" update="messages"
								process="@form" />
						</p:column>
					</p:row>
				</p:panelGrid>
			</h:form>
		</section>

	</ui:define>
</ui:composition>
