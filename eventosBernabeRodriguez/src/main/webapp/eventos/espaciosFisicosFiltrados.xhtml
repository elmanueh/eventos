<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition template="/WEB-INF/template/template.xhtml"
	xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">

	<ui:define name="title">
        Filtrar Espacios Fisicos
    </ui:define>

	<ui:define name="rol">
        Organizador
    </ui:define>

	<ui:define name="opciones">
		<p:button value="Crear Evento" outcome="/eventos/altaEvento.xhtml" />
	</ui:define>

	<ui:define name="content">
		<div>
			<h:form id="form">
				<p:growl id="messages" showDetail="true" />

				<p:dataTable id="espaciosFisicos" var="espacioFisicoDTO"
					value="#{filtrarEspacioFisicoWeb.espaciosFisicos}">

					<p:column headerText="Id">
						<h:outputText value="#{espacioFisicoDTO.id}" />
					</p:column>
					<p:column headerText="Nombre">
						<h:outputText value="#{espacioFisicoDTO.nombre}" />
					</p:column>
					<p:column headerText="Capacidad">
						<h:outputText value="#{espacioFisicoDTO.capacidad}" />
					</p:column>
					<p:column headerText="Dirección postal">
						<h:outputText value="#{espacioFisicoDTO.direccion}" />
					</p:column>
					<p:column headerText="Descripción">
						<h:outputText value="#{espacioFisicoDTO.descripcion}" />
					</p:column>
					<p:column headerText="Propietario">
						<h:outputText value="#{espacioFisicoDTO.propietario}" />
					</p:column>
				</p:dataTable>

				<div
					style="padding-left: 8rem; display: flex; flex-direction: row; margin-top: 50px; align-items: center; gap: 30px;">
					<div>
						<p:outputLabel value="Fecha de inicio:"
							style="padding-right: 10px;" />
						<p:datePicker id="fechaInicio"
							value="#{filtrarEspacioFisicoWeb.fechaInicio}" showTime="true"
							readonlyInput="true" maxdate="#{filtrarEspacioFisicoWeb.fechaFin}"
							hideOnDateTimeSelect="true">
							<p:ajax event="dateSelect" update="fechaFin" />
						</p:datePicker>
					</div>
					<div>
						<p:outputLabel value="Fecha de fin:" style="padding-right: 10px;" />
						<p:datePicker id="fechaFin"
							value="#{filtrarEspacioFisicoWeb.fechaFin}" showTime="true"
							readonlyInput="true" mindate="#{filtrarEspacioFisicoWeb.fechaInicio}"
							hideOnDateTimeSelect="true">
							<p:ajax event="dateSelect" update="fechaInicio" />
						</p:datePicker>
					</div>
					<div>
						<p:outputLabel value="Capacidad:" style="padding-right: 10px;" />
						<p:spinner value="#{filtrarEspacioFisicoWeb.capacidad}" min="1"
							converter="javax.faces.Integer" />
					</div>
					<div style="margin-left: auto; padding-right: 8rem;">
						<p:commandButton value="Buscar Espacios"
							action="#{filtrarEspacioFisicoWeb.load()}"
							update="espaciosFisicos messages" process="@form"
							styleClass="submit-button" />

					</div>
				</div>

			</h:form>
		</div>
	</ui:define>
</ui:composition>
