<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>EventApp | AADD</title>
	<h:outputStylesheet library="webjars"
		name="primeflex/3.3.1/primeflex.min.css" />
</h:head>

<h:body class="m-0 ">
	<section class="flex flex-column align-items-center">
		<p:growl id="messages" showDetail="true" />

		<h1 class="text-8xl">Bienvenido</h1>
		<h2 class="text-6xl mt-6">Selecciona tu rol</h2>
		<div class="flex w-2 justify-content-center">
			<h:form id="form" class="w-full">
				<div class="flex justify-content-evenly">
					<p:commandButton value="Propietario"
						styleClass="ui-button-raised py-2 font-bold"
						action="#{inicioWeb.cambiarAPropietario}" process="@form"
						update="messages" />
					<p:commandButton value="Organizador"
						styleClass="ui-button-raised font-bold"
						action="#{inicioWeb.cambiarAOrganizador}" process="@form" />
				</div>

				<div class="flex justify-content-center mt-5 ui-fluid">
					<span class="ui-float-label w-10"> <p:inputText
							id="nombreInput" value="#{inicioWeb.nombre}" /> <p:outputLabel
							for="@previous" value="Nombre" />
					</span>
				</div>
			</h:form>
		</div>
	</section>
</h:body>

</html>
