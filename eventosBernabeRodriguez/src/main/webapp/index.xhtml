<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
	<meta charset="utf-8" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge" />
	<title>Mis Espacios Fisicos</title>
</h:head>

<h:body>
	<div
		style="display: flex; justify-content: center; align-items: center; height: 70vh; flex-direction: column;">
		<p:growl id="messages" showDetail="true" />
		<!-- Título centrado -->
		<div>
			<h1 style="font-size: 100px;">Bienvenido</h1>
		</div>

		<div class="card" style="width: 100%; max-width: 600px;">
			<h:form id="form">
				<div style="display: flex; gap: 10px; margin-bottom: 20px;">
					<p:commandButton value="Propietario"
						action="#{inicioWeb.cambiarAPropietario}" process="@form"
						update="messages"
						style="width: 49%; font-size: 1.2em; padding: 10px;" />
					<p:commandButton value="Organizador"
						action="#{inicioWeb.cambiarAOrganizador}" process="@form"
						style="width: 49%; font-size: 1.2em; padding: 10px;" />
				</div>

				<!-- Campo de entrada centrado -->
				<div>
					<p:outputLabel value="Nombre:" for="nombreInput"
						style="font-size: 1.1em;" />
					<p:inputText id="nombreInput" value="#{inicioWeb.nombre}"
						style="width: 100%; font-size: 1.2em; padding: 10px;" />
				</div>
			</h:form>
		</div>
	</div>
</h:body>

</html>
